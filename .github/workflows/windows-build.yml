name: "Windows Build: SafeSales SMS"

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used for build"
        required: true
        default: "3.12"
      artifact-retention-days:
        description: "Artifact retention (days)"
        required: true
        default: "14"
      release-tag:
        description: "Release tag name to create (e.g. v1.0.0)"
        required: true
        default: ""
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SafeSalesSMS
  DIST_DIR: dist
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: "Verify (Windows)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Syntax compile check
        shell: pwsh
        run: python -m compileall -q easysms excel ui

      - name: Import smoke test
        shell: pwsh
        run: |
          python -c "import ui.app, ui.services, excel.loader, easysms; print('Imports OK')"

  build:
    name: "Build Windows app"
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "${env:APP_NAME}" `
            --version-file packaging/windows_version_info.txt `
            --collect-submodules win32more `
            --collect-binaries win32more `
            --collect-data win32more `
            --collect-submodules easysms `
            --collect-submodules excel `
            --collect-submodules ui `
            ui/__main__.py

      - name: Prepare package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "sha-${{ github.sha }}".Substring(0, 11) }
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $exeInDist = "${env:DIST_DIR}/${env:APP_NAME}.exe"
          $exeOut = "release/${env:APP_NAME}-windows-$version.exe"
          if (-not (Test-Path $exeInDist)) {
            throw "Expected PyInstaller output not found: $exeInDist"
          }
          Copy-Item -Path $exeInDist -Destination $exeOut -Force

      - name: Compute release metadata
        id: release-info
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $tag = "${{ github.event.inputs.release-tag }}"
          }
          elseif ("${{ github.ref_type }}" -eq 'tag') {
            $tag = "${{ github.ref_name }}"
          }

          git fetch --tags --prune
          $prevTag = $null
          try {
            $prevTag = git describe --tags --abbrev=0 --match 'v*' 2>$null
          } catch {
            $prevTag = $null
          }

          if ($tag) {
            if ($tag -notmatch '^v') {
              $title = "Release v$tag"
            } else {
              $title = "Release $tag"
            }

            if ($prevTag) {
              $commitList = git log $prevTag..HEAD --pretty=format:'- %s (%h)'
              if (-not $commitList) {
                $commitList = "No commits since $prevTag."
              }
              $body = "Commits since ${prevTag}`n`n${commitList}"
            } else {
              $commitList = git log --pretty=format:'- %s (%h)'
              if (-not $commitList) {
                $commitList = "No commits available."
              }
              $body = "No previous release tag found.`n`nCommits in repository:`n`n${commitList}"
            }
          } else {
            $title = "Build ${env:GITHUB_SHA}" 
            $commitList = git log --pretty=format:'- %s (%h)' -n 20
            if (-not $commitList) {
              $commitList = "No commits available."
            }
            $body = "No release tag available for this run.`n`nLatest commits:`n`n${commitList}"
          }

          echo "release_tag=$tag" >> $env:GITHUB_OUTPUT
          echo "release_title=$title" >> $env:GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-${{ github.ref_name || github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.artifact-retention-days || '14') }}

      - name: Create Git tag for workflow dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release-tag != ''
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release-tag }}"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          } else {
            Write-Host "Tag $tag already exists; skipping creation."
          }

      - name: Create GitHub release
        if: steps.release-info.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.release_tag }}
          name: ${{ steps.release-info.outputs.release_title }}
          body: ${{ steps.release-info.outputs.release_body }}
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          @"
          ## Windows build completed

          | Output | Value |
          |---|---|
          | File | $($exe.Name) |
          | Size | $([math]::Round($exe.Length / 1MB, 2)) MB |
          | Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

