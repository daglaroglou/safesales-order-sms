name: "Windows Build: SafeSales SMS"

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used for build"
        required: true
        default: "3.14"
      artifact-retention-days:
        description: "Artifact retention (days)"
        required: true
        default: "14"
      release-tag:
        description: "Release tag name to create (e.g. v1.0.0)"
        required: true
        default: ""
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SafeSalesSMS
  DIST_DIR: dist
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: "Verify (Windows)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.14' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Syntax compile check
        shell: pwsh
        run: python -m compileall -q easysms excel ui

      - name: Import smoke test
        shell: pwsh
        run: |
          python -c "import ui.app, ui.services, excel.loader, easysms; print('Imports OK')"

  build:
    name: "Build Windows app"
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.14' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "${env:APP_NAME}" `
            --version-file packaging/windows_version_info.txt `
            --collect-submodules win32more `
            --collect-binaries win32more `
            --collect-data win32more `
            --collect-submodules easysms `
            --collect-submodules excel `
            --collect-submodules ui `
            ui/__main__.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $rawVersion = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.release-tag }}") {
            $rawVersion = "${{ github.event.inputs.release-tag }}"
          }
          elseif ("${{ github.ref_type }}" -eq "tag") {
            $rawVersion = "${{ github.ref_name }}"
          }
          else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $rawVersion = "0.0.0-dev.$shortSha"
          }
          $version = if ($rawVersion -match "^v") { $rawVersion.Substring(1) } else { $rawVersion }
          .\packaging\build_installer.ps1 -Version $version

      - name: Prepare package
        shell: pwsh
        run: |
          $rawVersion = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.release-tag }}") {
            $rawVersion = "${{ github.event.inputs.release-tag }}"
          }
          elseif ("${{ github.ref_type }}" -eq "tag") {
            $rawVersion = "${{ github.ref_name }}"
          }
          else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $rawVersion = "0.0.0-dev.$shortSha"
          }
          $version = if ($rawVersion -match "^v") { $rawVersion } else { "v$rawVersion" }
          $version = $version -replace "[^0-9A-Za-z\.\-\+]", "-"
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $exeInDist = "${env:DIST_DIR}/${env:APP_NAME}.exe"
          $exeOut = "release/${env:APP_NAME}-$version.exe"
          if (-not (Test-Path $exeInDist)) {
            throw "Expected PyInstaller output not found: $exeInDist"
          }
          Copy-Item -Path $exeInDist -Destination $exeOut -Force
          $hash = (Get-FileHash -Path $exeOut -Algorithm SHA256).Hash.ToLower()
          $shaFile = "$exeOut.sha256"
          Set-Content -Path $shaFile -Value "$hash  $([System.IO.Path]::GetFileName($exeOut))"

      - name: Compute release metadata
        id: release-info
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $tag = "${{ github.event.inputs.release-tag }}"
          }
          elseif ("${{ github.ref_type }}" -eq 'tag') {
            $tag = "${{ github.ref_name }}"
          }
          $normalizedTag = if ($tag -and $tag -notmatch '^v') { "v$tag" } else { $tag }

          git fetch --tags --prune
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"

          $allTags = @()
          try {
            $allTags = @(git tag --list 'v*' --sort=-version:refname)
          }
          catch {
            $allTags = @()
          }
          $prevTag = $null
          foreach ($t in $allTags) {
            if (-not $normalizedTag -or $t -ne $normalizedTag) {
              $prevTag = $t
              break
            }
          }

          if ($normalizedTag) {
            $title = "Release $normalizedTag"
            $commitMode = "range"
            if ($prevTag) {
              $range = "$prevTag..HEAD"
              $heading = "## What's New in $normalizedTag"
              $subheading = "_Compared with $prevTag_"
            } else {
              $range = "HEAD"
              $heading = "## What's New in $normalizedTag"
              $subheading = "_First tagged release in this repository_"
            }
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $title = "Build $shortSha"
            $commitMode = "count"
            $maxCommits = 20
            $heading = "## Build Snapshot"
            $subheading = "_No release tag for this run_"
          }

          $rawCommits = @()
          try {
            if ($commitMode -eq "count") {
              $rawCommits = @(git log -n $maxCommits --pretty=format:'%s|%h|%H|%an')
            } else {
              $rawCommits = @(git log $range --pretty=format:'%s|%h|%H|%an')
            }
          }
          catch {
            $rawCommits = @()
          }

          $commitItems = @()
          foreach ($line in $rawCommits) {
            if (-not $line) { continue }
            $parts = $line -split '\|', 4
            if ($parts.Count -lt 4) { continue }
            $subject = $parts[0].Trim()
            $short = $parts[1].Trim()
            $full = $parts[2].Trim()
            $author = $parts[3].Trim()
            if (-not $subject) { continue }
            $commitItems += ("- {0} ([{1}]({2}/commit/{3}), {4})" -f $subject, $short, $repoUrl, $full, $author)
          }

          if (-not $commitItems) {
            $commitItems = @("- No commits found for this range.")
          }

          $bodyLines = @(
            $heading,
            "",
            $subheading,
            "",
            "### Commit History",
            ""
          ) + $commitItems + @(
            "",
            "---",
            "",
            "Generated by GitHub Actions: [Run #${{ github.run_number }}]($repoUrl/actions/runs/${{ github.run_id }})"
          )
          $body = $bodyLines -join "`n"

          echo "release_tag=$normalizedTag" >> $env:GITHUB_OUTPUT
          echo "release_title=$title" >> $env:GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-${{ github.ref_name || github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.artifact-retention-days || '14') }}

      - name: Create Git tag for workflow dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release-tag != ''
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.release-tag }}"
          $tag = if ($rawTag -match '^v') { $rawTag } else { "v$rawTag" }
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          } else {
            Write-Host "Tag $tag already exists; skipping creation."
          }

      - name: Create GitHub release
        if: steps.release-info.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.release_tag }}
          name: ${{ steps.release-info.outputs.release_title }}
          body: ${{ steps.release-info.outputs.release_body }}
          files: |
            release/*.exe
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          $sha = Get-ChildItem release/*.sha256 | Select-Object -First 1
          $shaValue = if ($sha) { (Get-Content $sha.FullName | Select-Object -First 1) } else { "N/A" }
          @"
          ## Windows build completed

          | Output | Value |
          |---|---|
          | File | $($exe.Name) |
          | Size | $([math]::Round($exe.Length / 1MB, 2)) MB |
          | SHA256 | $shaValue |
          | Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

