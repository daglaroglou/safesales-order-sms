name: "Windows Build: SafeSales SMS"

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used for build"
        required: true
        default: "3.12"
      artifact-retention-days:
        description: "Artifact retention (days)"
        required: true
        default: "14"
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SafeSalesSMS
  DIST_DIR: dist
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: "Verify (Windows)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Syntax compile check
        shell: pwsh
        run: python -m compileall -q easysms excel ui

      - name: Import smoke test
        shell: pwsh
        run: |
          python -c "import ui.app, ui.services, excel.loader, easysms; print('Imports OK')"

  build:
    name: "Build Windows app"
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "${env:APP_NAME}" `
            --version-file packaging/windows_version_info.txt `
            --collect-submodules win32more `
            --collect-binaries win32more `
            --collect-data win32more `
            --collect-submodules easysms `
            --collect-submodules excel `
            --collect-submodules ui `
            ui/__main__.py

      - name: Prepare package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "sha-${{ github.sha }}".Substring(0, 11) }
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $exeInDist = "${env:DIST_DIR}/${env:APP_NAME}.exe"
          $exeOut = "release/${env:APP_NAME}-windows-$version.exe"
          if (-not (Test-Path $exeInDist)) {
            throw "Expected PyInstaller output not found: $exeInDist"
          }
          Copy-Item -Path $exeInDist -Destination $exeOut -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-${{ github.ref_name || github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.artifact-retention-days || '14') }}

      - name: Build summary
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          @"
          ## Windows build completed

          | Output | Value |
          |---|---|
          | File | $($exe.Name) |
          | Size | $([math]::Round($exe.Length / 1MB, 2)) MB |
          | Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
